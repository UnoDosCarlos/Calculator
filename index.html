<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css">

</head>



<body>

    <h1>Calculator</h1>

    <div class="calculator">
            <input id="screen" readonly>

            <div id="grid">
                <button onclick="clearScreen()" class="special-button" id="clear">C</button>
                <button onclick="removeNumber()" class="special-button" id="backspace">⌫</button>
                <button onclick="showOnScreen('x²')" class="special-button" id>x²</button>
                <button onclick="showOnScreen('/')" class="special-button" id="divide">/</button>
                <button onclick="showOnScreen('1')" value="1">1</button>
                <button onclick="showOnScreen('2')" value="2">2</button>
                <button onclick="showOnScreen('3')" value="3">3</button>
                <button onclick="showOnScreen('*')" class="special-button" id="multiply">*</button>
                <button onclick="showOnScreen('4')" value="4">4</button>
                <button onclick="showOnScreen('5')" value="5">5</button>
                <button onclick="showOnScreen('6')" value="6">6</button>
                <button onclick="showOnScreen('-')" class="special-button" id="subtract">-</button>
                <button onclick="showOnScreen('7')" value="7">7</button>
                <button onclick="showOnScreen('8')" value="8">8</button>
                <button onclick="showOnScreen('9')" value="9">9</button>
                <button onclick="showOnScreen('+')" class="special-button" id="add">+</button>
                <button onclick="rickRoll()" class="special-button" id>RR</button>
                <button onclick="showOnScreen('0')"  value="0">0</button>
                <button onclick="showOnScreen('.')" class="special-button" id="decimal">.</button>
                <button onclick="calculate()" class="special-button" id>=</button>
            </div>
    </div>
</div>


<script src="./javascript.js"></script>
</body>
</html>
