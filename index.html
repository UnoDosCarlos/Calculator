<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css">

</head>



<body>

    <h1>Calculator</h1>

    <div class="calculator">
            <div class="screen">
                <div class="previous-number"></div>
                <div class="current-number"></div>


            </div>

            <div id="grid">
                <button class="special-button" id="clear">C</button>
                <button class="special-button" id="backspace">⌫</button>
                <button class="operand-button" id="power">x²</button>
                <button class="operand-button" id="divide">/</button>
                <button class="number-button">1</button>
                <button class="number-button">2</button>
                <button class="number-button">3</button>
                <button class="operand-button" id="multiply">*</button>
                <button class="number-button">4</button>
                <button class="number-button">5</button>
                <button class="number-button">6</button>
                <button class="operand-button" id="subtract">-</button>
                <button class="number-button">7</button>
                <button class="number-button">8</button>
                <button class="number-button">9</button>
                <button class="operand-button" id="add">+</button>
                <button onclick="window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ');" class="special-button" id>RR</button>
                <button class="number-button">0</button>
                <button class="number-button" id="decimal">.</button>
                <button class="equals">=</button>
            </div>
    </div>
</div>


<script src="./javascript.js"></script>
</body>
</html>
